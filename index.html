<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Hola Mundo Molón!</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="stage">
    <h1 class="title" aria-label="Hola Mundo">
      <span class="word">Hola</span>
      <span class="word accent">Mundo</span>
    </h1>
    <p class="subtitle">Bienvenido a algo <em>molón</em> ✨</p>
    <button id="surprise" class="btn" type="button">Dame magia 🎉</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
